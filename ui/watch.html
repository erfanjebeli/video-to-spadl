<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ایونت‌ها روی ویدیو</title>
  <style>
    @font-face {
      font-family: "Vazirmatn";
      src: url("/fonts/Vazirmatn-Regular.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Vazirmatn";
      src: url("/fonts/Vazirmatn-SemiBold.woff2") format("woff2");
      font-weight: 600;
      font-display: swap;
    }

    :root {
      --ink: #101411;
      --chalk: #f3ecdc;
      --amber: #e8943a;
      --line: rgba(236, 245, 232, 0.78);
      --team-a: #e23b3b;
      --team-b: #2f6dff;
      --team-unknown: #d9d2c3;
      --pitch-a: #1f6b3d;
      --pitch-b: #175832;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      color: var(--chalk);
      background: var(--ink);
      font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 22px 8px;
    }
    header a { color: var(--chalk); }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }

    .stage {
      position: relative;
      width: min(1180px, calc(100% - 32px));
      margin: 8px auto 24px;
      background: #000;
    }
    video { width: 100%; display: block; background: #000; }

    .jump {
      position: absolute;
      top: 42%;
      z-index: 2;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--chalk);
      color: var(--chalk);
      background: rgba(16, 20, 17, 0.72);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    .jump.prev { left: 12px; }
    .jump.next { right: 12px; }
    .jump:disabled { opacity: 0.35; cursor: default; }
    .jump:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

    .caption {
      position: absolute;
      left: 50%;
      bottom: 58px;
      z-index: 2;
      transform: translateX(-50%);
      max-width: min(640px, calc(100% - 120px));
      padding: 8px 14px;
      text-align: center;
      background: rgba(16, 20, 17, 0.82);
      border: 1px solid rgba(243, 236, 220, 0.35);
    }
    .caption p { margin: 0; }
    .caption .meta { display: flex; justify-content: center; gap: 10px; }
    .caption strong { display: block; font-size: 18px; }
    .caption span { color: rgba(243, 236, 220, 0.78); font-size: 13px; }

    .map {
      position: absolute;
      left: 14px;
      bottom: 58px;
      z-index: 2;
      width: min(268px, 36%);
      aspect-ratio: 105 / 68;
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid rgba(236, 245, 232, 0.28);
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      background:
        linear-gradient(160deg, rgba(8, 18, 12, 0.22), rgba(0, 0, 0, 0.18)),
        repeating-linear-gradient(
          90deg,
          var(--pitch-a) 0 12.5%,
          var(--pitch-b) 12.5% 25%
        );
    }
    .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .map svg .pitch-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 0.55;
      vector-effect: non-scaling-stroke;
    }
    .map svg .pitch-fill { fill: rgba(255, 255, 255, 0.03); stroke: none; }
    .map svg .pitch-spot { fill: rgba(236, 245, 232, 0.9); stroke: none; }
    .map svg .goal-line { stroke: rgba(255, 255, 255, 0.92); stroke-width: 1.35; }
    .map svg line.pass {
      fill: none;
      stroke: rgba(255, 236, 180, 0.78);
      stroke-width: 0.85;
      stroke-dasharray: 1.4 1.1;
      stroke-linecap: round;
      filter: drop-shadow(0 0 0.35px rgba(0, 0, 0, 0.35));
    }
    .map svg line.pass.team-0 { stroke: rgba(226, 59, 59, 0.88); }
    .map svg line.pass.team-1 { stroke: rgba(47, 109, 255, 0.88); }
    #ball {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%, #ffffff 0 34%, #f0f0f0 35% 62%, #c8c8c8 100%);
      box-shadow:
        0 0 0 1.5px rgba(16, 20, 17, 0.55),
        0 1px 3px rgba(0, 0, 0, 0.45),
        0 0 10px rgba(255, 255, 255, 0.22);
      transform: translate(-50%, 50%);
      z-index: 3;
      pointer-events: none;
    }
    #ball::after {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      border: 1px solid rgba(40, 40, 40, 0.35);
      background:
        linear-gradient(115deg, transparent 46%, rgba(40, 40, 40, 0.45) 49% 51%, transparent 54%),
        linear-gradient(25deg, transparent 46%, rgba(40, 40, 40, 0.4) 49% 51%, transparent 54%);
      opacity: 0.85;
    }
    .marks { position: absolute; inset: 0; }
    .mark {
      position: absolute;
      width: 7px;
      height: 7px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      transform: translate(-50%, 50%);
      background: var(--team-unknown);
      box-shadow: 0 0 0 1.25px rgba(255, 255, 255, 0.85), 0 1px 2px rgba(0, 0, 0, 0.35);
      color: #fff;
      font: 700 10px/1 "Vazirmatn", Tahoma, sans-serif;
      cursor: pointer;
      z-index: 1;
    }
    .mark.team-0 { background: var(--team-a); }
    .mark.team-1 { background: var(--team-b); }
    .mark.off {
      background: transparent;
      box-shadow: inset 0 0 0 1.5px var(--amber), 0 0 0 1px rgba(0, 0, 0, 0.25);
    }
    .mark.now {
      width: 12px;
      height: 12px;
      z-index: 2;
      box-shadow:
        0 0 0 1.5px rgba(255, 255, 255, 0.95),
        0 0 0 3px rgba(232, 148, 58, 0.28),
        0 1px 4px rgba(0, 0, 0, 0.35);
      animation: pulse-now 1.6s ease-in-out infinite;
    }
    .mark.now.team-0 { background: var(--team-a); }
    .mark.now.team-1 { background: var(--team-b); }
    @keyframes pulse-now {
      0%, 100% { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.95), 0 0 0 3px rgba(232, 148, 58, 0.22), 0 1px 4px rgba(0, 0, 0, 0.35); }
      50% { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.95), 0 0 0 4px rgba(232, 148, 58, 0.14), 0 1px 5px rgba(0, 0, 0, 0.4); }
    }
    .mark:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }

    .empty, .choices { width: min(720px, calc(100% - 32px)); margin: 24px auto; font-size: 18px; }
    .choices a { color: var(--amber); }
    .choices li { margin: 8px 0; }

    .work {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto 28px;
      display: grid;
      gap: 14px;
    }
    .review {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.9fr);
      gap: 12px;
      align-items: start;
    }
    .card {
      background: rgba(16, 20, 17, 0.92);
      border: 1px solid rgba(243, 236, 220, 0.22);
      border-radius: 12px;
      padding: 12px;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 600;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }
    .toolbar label { font-size: 13px; color: rgba(243, 236, 220, 0.78); }
    .toolbar select, .toolbar button, .form select, .form input, .form textarea, .form button {
      font: inherit;
      color: var(--chalk);
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(243, 236, 220, 0.28);
      border-radius: 8px;
      padding: 6px 10px;
    }
    .toolbar button, .form button {
      cursor: pointer;
      background: rgba(232, 148, 58, 0.18);
      border-color: rgba(232, 148, 58, 0.55);
    }
    .toolbar button.danger, .form button.danger {
      background: rgba(226, 59, 59, 0.16);
      border-color: rgba(226, 59, 59, 0.55);
    }
    .toolbar button:disabled, .form button:disabled { opacity: 0.45; cursor: default; }
    .badge-manual {
      display: inline-block;
      margin-inline-start: 4px;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 11px;
      background: rgba(47, 109, 255, 0.28);
    }
    .table-wrap { max-height: 340px; overflow: auto; border-radius: 8px; }
    table.events {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    table.events th, table.events td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(243, 236, 220, 0.12);
      text-align: right;
      white-space: nowrap;
    }
    table.events th { position: sticky; top: 0; background: #151a16; z-index: 1; }
    table.events tbody tr { cursor: pointer; }
    table.events tbody tr:hover { background: rgba(232, 148, 58, 0.08); }
    table.events tbody tr.active { background: rgba(232, 148, 58, 0.16); }
    table.events tbody tr.low { box-shadow: inset 3px 0 0 #e23b3b; }
    .conf {
      display: inline-block;
      min-width: 3.2em;
      padding: 2px 6px;
      border-radius: 999px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      background: rgba(243, 236, 220, 0.12);
    }
    .conf.high { background: rgba(56, 160, 90, 0.28); }
    .conf.mid { background: rgba(232, 148, 58, 0.28); }
    .conf.low { background: rgba(226, 59, 59, 0.3); }
    .form { display: grid; gap: 8px; }
    .form .row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; }
    .form .row label { font-size: 13px; color: rgba(243, 236, 220, 0.78); }
    .form textarea { min-height: 64px; resize: vertical; }
    .form .hint { font-size: 12px; color: rgba(243, 236, 220, 0.62); line-height: 1.5; }
    .form .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .caption .conf { margin-inline-start: 6px; }
    @media (max-width: 920px) {
      .review { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/">بازگشت</a>
    <h1 id="title">ایونت‌ها روی ویدیو</h1>
  </header>
  <p class="empty" id="empty" hidden></p>
  <ul class="choices" id="choices" hidden></ul>
  <div class="stage" id="stage" hidden>
    <video id="video" controls playsinline></video>
    <button type="button" class="jump prev" id="prev">قبلی</button>
    <button type="button" class="jump next" id="next">بعدی</button>
    <div class="map" id="map">
      <svg viewBox="0 0 105 68" aria-hidden="true">
        <rect class="pitch-fill" x="0.8" y="0.8" width="103.4" height="66.4" rx="1.2"></rect>
        <rect class="pitch-line" x="0.8" y="0.8" width="103.4" height="66.4" rx="1.2"></rect>
        <line class="pitch-line" x1="52.5" y1="0.8" x2="52.5" y2="67.2"></line>
        <circle class="pitch-line" cx="52.5" cy="34" r="9.15"></circle>
        <circle class="pitch-spot" cx="52.5" cy="34" r="0.7"></circle>
        <rect class="pitch-line" x="0.8" y="13.84" width="16.5" height="40.32"></rect>
        <rect class="pitch-line" x="0.8" y="24.84" width="5.5" height="18.32"></rect>
        <rect class="pitch-line" x="87.7" y="13.84" width="16.5" height="40.32"></rect>
        <rect class="pitch-line" x="98.7" y="24.84" width="5.5" height="18.32"></rect>
        <path class="pitch-line" d="M17.3 26.2 A9.15 9.15 0 0 1 17.3 41.8"></path>
        <path class="pitch-line" d="M87.7 26.2 A9.15 9.15 0 0 0 87.7 41.8"></path>
        <line class="pitch-line goal-line" x1="0.8" y1="30.34" x2="0.8" y2="37.66"></line>
        <line class="pitch-line goal-line" x1="104.2" y1="30.34" x2="104.2" y2="37.66"></line>
        <g id="passes"></g>
      </svg>
      <div class="marks" id="marks"></div>
      <div id="ball" hidden></div>
    </div>
    <div class="caption" id="caption">
      <p class="meta"><span id="count"></span><span id="clock" dir="ltr"></span><span id="confidence" class="conf" hidden></span></p>
      <strong id="kind"></strong>
      <span id="place" dir="ltr"></span>
    </div>
  </div>
  <div class="work" id="work" hidden>
    <div class="review">
      <section class="card">
        <h2>لیست ایونت‌ها برای اپراتور</h2>
        <div class="toolbar">
          <label for="sortBy">مرتب‌سازی</label>
          <select id="sortBy">
            <option value="time">زمان</option>
            <option value="confidence-asc">اطمینان (کم به زیاد)</option>
            <option value="confidence-desc">اطمینان (زیاد به کم)</option>
            <option value="pending">اول بررسی‌نشده‌ها</option>
          </select>
          <label for="filterLow"><input type="checkbox" id="filterLow"> فقط اطمینان زیر ۵۰٪</label>
          <button type="button" id="addEvent">افزودن در زمان ویدیو</button>
          <button type="button" id="deleteEvent" class="danger">حذف ایونت</button>
        </div>
        <div class="table-wrap">
          <table class="events">
            <thead>
              <tr>
                <th>#</th>
                <th>زمان</th>
                <th>نوع</th>
                <th>اطمینان</th>
                <th>نتیجه</th>
                <th>پیراهن</th>
                <th>وضعیت</th>
              </tr>
            </thead>
            <tbody id="eventRows"></tbody>
          </table>
        </div>
      </section>
      <section class="card">
        <h2>فرم اصلاح ایونت</h2>
        <form class="form" id="reviewForm">
          <p class="hint">مدل فقط پیشنهاد می‌دهد. برای ایونت جاافتاده «افزودن در زمان ویدیو» را بزن. روی مینی‌مپ کلیک کن تا مختصات همین ایونت عوض شود.</p>
          <div class="row"><label for="fieldTime">زمان (ثانیه)</label><input id="fieldTime" type="number" min="0" step="0.01" dir="ltr"></div>
          <div class="row"><label for="fieldX">X</label><input id="fieldX" type="number" step="0.1" dir="ltr" placeholder="۰ تا ۱۰۵"></div>
          <div class="row"><label for="fieldY">Y</label><input id="fieldY" type="number" step="0.1" dir="ltr" placeholder="۰ تا ۶۸"></div>
          <div class="row"><label for="fieldType">نوع</label>
            <select id="fieldType">
              <option value="PASS">پاس</option>
              <option value="CROSS">سانتر</option>
              <option value="THROW IN">پرتاب اوت</option>
              <option value="DRIVE">حمل توپ</option>
              <option value="SHOT">شوت</option>
              <option value="GOAL">گل</option>
              <option value="BALL PLAYER BLOCK">قطع توپ</option>
              <option value="PLAYER SUCCESSFUL TACKLE">تکل موفق</option>
            </select>
          </div>
          <div class="row"><label for="fieldResult">نتیجه</label>
            <select id="fieldResult">
              <option value="">— خالی —</option>
              <option value="success">موفق</option>
              <option value="fail">ناموفق</option>
              <option value="offside">آفساید</option>
              <option value="owngoal">گل به خودی</option>
              <option value="yellow_card">کارت زرد</option>
              <option value="red_card">کارت قرمز</option>
            </select>
          </div>
          <div class="row"><label for="fieldBodypart">عضو بدن</label>
            <select id="fieldBodypart">
              <option value="">— خالی —</option>
              <option value="foot">پا</option>
              <option value="foot_left">پای چپ</option>
              <option value="foot_right">پای راست</option>
              <option value="head">سر</option>
              <option value="other">سایر</option>
            </select>
          </div>
          <div class="row"><label for="fieldJersey">شماره پیراهن</label><input id="fieldJersey" type="number" min="0" max="99" placeholder="مثلاً ۱۰"></div>
          <div class="row"><label for="fieldTeam">تیم</label>
            <select id="fieldTeam">
              <option value="">— نامشخص —</option>
              <option value="0">تیم ۰ (قرمز)</option>
              <option value="1">تیم ۱ (آبی)</option>
            </select>
          </div>
          <div class="row"><label for="fieldStatus">وضعیت بررسی</label>
            <select id="fieldStatus">
              <option value="pending">نیاز به بررسی</option>
              <option value="ok">تأیید</option>
              <option value="fixed">اصلاح شد</option>
              <option value="reject">حذف / رد</option>
            </select>
          </div>
          <div class="row"><label for="fieldNote">یادداشت</label><textarea id="fieldNote" placeholder="نکته برای خودت یا اپراتور بعدی"></textarea></div>
          <p class="hint" id="qualityHint"></p>
          <div class="actions">
            <button type="submit" id="saveOne">ذخیره این ایونت</button>
            <button type="button" id="saveAll">ذخیره همه تغییرها</button>
            <button type="button" id="deleteEventForm" class="danger">حذف ایونت</button>
            <span id="saveMsg" class="hint"></span>
          </div>
        </form>
      </section>
    </div>
  </div>
  <script>
    const NAMES = {
      PASS: "پاس",
      CROSS: "سانتر",
      "THROW IN": "پرتاب اوت",
      SHOT: "شوت",
      GOAL: "گل",
      DRIVE: "حمل توپ",
      "BALL PLAYER BLOCK": "قطع توپ",
      "PLAYER SUCCESSFUL TACKLE": "تکل موفق",
    };

    const video = document.querySelector("#video");
    const stage = document.querySelector("#stage");
    const work = document.querySelector("#work");
    const empty = document.querySelector("#empty");
    const choices = document.querySelector("#choices");
    const title = document.querySelector("#title");
    const passes = document.querySelector("#passes");
    const marks = document.querySelector("#marks");
    const ball = document.querySelector("#ball");
    const kind = document.querySelector("#kind");
    const clock = document.querySelector("#clock");
    const confidenceEl = document.querySelector("#confidence");
    const place = document.querySelector("#place");
    const prev = document.querySelector("#prev");
    const next = document.querySelector("#next");
    const eventRows = document.querySelector("#eventRows");
    const sortBy = document.querySelector("#sortBy");
    const filterLow = document.querySelector("#filterLow");
    const fieldType = document.querySelector("#fieldType");
    const fieldTime = document.querySelector("#fieldTime");
    const fieldX = document.querySelector("#fieldX");
    const fieldY = document.querySelector("#fieldY");
    const fieldResult = document.querySelector("#fieldResult");
    const fieldBodypart = document.querySelector("#fieldBodypart");
    const fieldJersey = document.querySelector("#fieldJersey");
    const fieldTeam = document.querySelector("#fieldTeam");
    const fieldStatus = document.querySelector("#fieldStatus");
    const fieldNote = document.querySelector("#fieldNote");
    const qualityHint = document.querySelector("#qualityHint");
    const saveMsg = document.querySelector("#saveMsg");
    const reviewForm = document.querySelector("#reviewForm");
    const mapEl = document.querySelector("#map");

    let events = [];
    let current = 0;
    let seeking = false;
    let dirty = new Set();
    let clipStem = "";
    let filling = false;

    const STATUS_FA = { pending: "بررسی", ok: "تأیید", fixed: "اصلاح", reject: "رد" };

    function params() {
      return new URLSearchParams(location.search);
    }

    function labelOf(type) {
      if (!type) return "ایونت";
      return NAMES[type] ? NAMES[type] + " · " + type : type;
    }

    function fa(value) {
      return String(value).replace(/\d/g, (digit) => "۰۱۲۳۴۵۶۷۸۹"[digit]);
    }

    function clockText(seconds) {
      const value = Math.max(0, Number(seconds) || 0);
      const minutes = Math.floor(value / 60);
      const rest = (value - minutes * 60).toFixed(1).padStart(4, "0");
      return minutes + ":" + rest;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function isPass(item) {
      return item && (item.type === "PASS" || item.type === "CROSS");
    }

    function teamClass(item) {
      if (!item || item.team === null || item.team === undefined) return "";
      if (item.team === 0) return "team-0";
      if (item.team === 1) return "team-1";
      return "";
    }

    function confidenceLevel(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "";
      if (value < 0.5) return "low";
      if (value < 0.7) return "mid";
      return "high";
    }

    function confidenceText(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "—";
      return Math.round(Number(value) * 100) + "%";
    }

    function ensureTypeOption(type) {
      if (!type) return;
      const exists = Array.from(fieldType.options).some((option) => option.value === type);
      if (!exists) {
        const option = document.createElement("option");
        option.value = type;
        option.textContent = type;
        fieldType.appendChild(option);
      }
    }

    function orderedIndexes() {
      let indexes = events.map((_, index) => index);
      if (filterLow.checked) {
        indexes = indexes.filter((index) => {
          const value = events[index].confidence;
          return value !== null && value !== undefined && value < 0.5;
        });
      }
      const mode = sortBy.value;
      indexes.sort((a, b) => {
        const left = events[a];
        const right = events[b];
        if (mode === "confidence-asc") return (left.confidence ?? 2) - (right.confidence ?? 2) || a - b;
        if (mode === "confidence-desc") return (right.confidence ?? -1) - (left.confidence ?? -1) || a - b;
        if (mode === "pending") {
          const leftPending = left.review_status === "pending" ? 0 : 1;
          const rightPending = right.review_status === "pending" ? 0 : 1;
          return leftPending - rightPending || (left.confidence ?? 2) - (right.confidence ?? 2) || a - b;
        }
        return (left.time || 0) - (right.time || 0) || a - b;
      });
      return indexes;
    }

    function renderList() {
      eventRows.replaceChildren();
      orderedIndexes().forEach((index) => {
        const item = events[index];
        const row = document.createElement("tr");
        const level = confidenceLevel(item.confidence);
        row.className = (index === current ? "active" : "") + (level === "low" ? " low" : "");
        const manual = item.source === "operator"
          ? " <span class=\"badge-manual\">دستی</span>"
          : "";
        row.innerHTML =
          "<td>" + fa(index + 1) + "</td>" +
          "<td dir=\"ltr\">" + clockText(item.time) + "</td>" +
          "<td>" + (NAMES[item.type] || item.type || "—") + manual + "</td>" +
          "<td><span class=\"conf " + level + "\">" + (item.source === "operator" ? "دستی" : confidenceText(item.confidence)) + "</span></td>" +
          "<td>" + (item.result || "—") + "</td>" +
          "<td>" + (item.jersey === null || item.jersey === undefined ? "—" : fa(item.jersey)) + "</td>" +
          "<td>" + (STATUS_FA[item.review_status] || item.review_status || "بررسی") + "</td>";
        row.addEventListener("click", () => go(index));
        eventRows.appendChild(row);
      });
    }

    function fillForm() {
      const item = events[current];
      if (!item) return;
      filling = true;
      ensureTypeOption(item.type);
      fieldType.value = item.type || "PASS";
      fieldTime.value = item.time === null || item.time === undefined ? "" : item.time;
      fieldX.value = item.x === null || item.x === undefined ? "" : item.x;
      fieldY.value = item.y === null || item.y === undefined ? "" : item.y;
      fieldResult.value = item.result || "";
      fieldBodypart.value = item.bodypart || "";
      fieldJersey.value = item.jersey === null || item.jersey === undefined ? "" : item.jersey;
      fieldTeam.value = item.team === null || item.team === undefined ? "" : String(item.team);
      fieldStatus.value = item.review_status || "pending";
      fieldNote.value = item.note || "";
      const hints = [];
      if (item.source === "operator") hints.push("این ایونت دستی اضافه شده");
      if (item.confidence !== null && item.confidence !== undefined) {
        hints.push("اطمینان مدل: " + confidenceText(item.confidence));
      }
      if (item.on_pitch === false) hints.push("مختصات خارج زمین است");
      if (item.ball_seen === false) hints.push("توپ در این فریم دیده نشده");
      if (item.player_distance !== null && item.player_distance !== undefined) {
        hints.push("فاصله بازیکن تا توپ: " + item.player_distance + " متر");
      }
      qualityHint.textContent = hints.join(" · ");
      filling = false;
    }

    function readFormIntoCurrent() {
      const item = events[current];
      if (!item || filling) return;
      item.type = fieldType.value || item.type;
      item.time = fieldTime.value === "" ? item.time : Number(fieldTime.value);
      item.x = fieldX.value === "" ? null : Number(fieldX.value);
      item.y = fieldY.value === "" ? null : Number(fieldY.value);
      item.result = fieldResult.value || null;
      item.bodypart = fieldBodypart.value || null;
      item.jersey = fieldJersey.value === "" ? null : Number(fieldJersey.value);
      item.team = fieldTeam.value === "" ? null : Number(fieldTeam.value);
      item.review_status = fieldStatus.value || "pending";
      item.note = fieldNote.value.trim() || null;
      dirty.add(item.id);
    }

    function editPayload(item) {
      return {
        id: item.id,
        type: item.type,
        time: item.time,
        x: item.x,
        y: item.y,
        result: item.result,
        bodypart: item.bodypart,
        jersey: item.jersey,
        team: item.team,
        review_status: item.review_status,
        note: item.note,
      };
    }

    async function saveEdits(onlyCurrent) {
      if (!clipStem) return;
      readFormIntoCurrent();
      const payload = {
        events: events
          .filter((item) => !onlyCurrent || item.id === events[current].id)
          .filter((item) => dirty.has(item.id) || (onlyCurrent && item.id === events[current].id))
          .map(editPayload),
      };
      if (!payload.events.length && onlyCurrent && events[current]) {
        payload.events = [editPayload(events[current])];
      }
      saveMsg.textContent = "در حال ذخیره…";
      const response = await fetch("/api/clips/" + encodeURIComponent(clipStem) + "/review", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await response.json();
      if (!response.ok) {
        saveMsg.textContent = data.message || "ذخیره نشد.";
        return;
      }
      const selectedId = events[current] ? events[current].id : null;
      events = data.events || events;
      dirty.clear();
      if (selectedId !== null) {
        const nextIndex = events.findIndex((item) => item.id === selectedId);
        current = nextIndex >= 0 ? nextIndex : Math.min(current, Math.max(0, events.length - 1));
      }
      saveMsg.textContent = "ذخیره شد.";
      draw();
    }

    async function addEventAtVideo() {
      if (!clipStem) return;
      readFormIntoCurrent();
      const time = Number.isFinite(video.currentTime) ? video.currentTime : Number(fieldTime.value || 0);
      const point = ballAt(time);
      const payload = {
        time: Math.round(time * 100) / 100,
        type: fieldType.value || "PASS",
        team: fieldTeam.value === "" ? null : Number(fieldTeam.value),
        jersey: fieldJersey.value === "" ? null : Number(fieldJersey.value),
        result: fieldResult.value || null,
        bodypart: fieldBodypart.value || null,
        note: fieldNote.value.trim() || "افزوده توسط اپراتور",
        review_status: "fixed",
        x: point ? point.x : (fieldX.value === "" ? null : Number(fieldX.value)),
        y: point ? point.y : (fieldY.value === "" ? null : Number(fieldY.value)),
      };
      saveMsg.textContent = "در حال افزودن…";
      const response = await fetch("/api/clips/" + encodeURIComponent(clipStem) + "/events/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await response.json();
      if (!response.ok) {
        saveMsg.textContent = data.message || "افزوده نشد.";
        return;
      }
      events = data.events || events;
      dirty.clear();
      if (data.added_id !== null && data.added_id !== undefined) {
        const nextIndex = events.findIndex((item) => item.id === data.added_id);
        current = nextIndex >= 0 ? nextIndex : current;
      } else {
        current = Math.max(0, events.length - 1);
      }
      saveMsg.textContent = "ایونت دستی اضافه شد.";
      draw();
      go(current);
    }

    async function deleteCurrentEvent() {
      if (!clipStem || !events[current]) return;
      const item = events[current];
      const label = (NAMES[item.type] || item.type || "ایونت") + " @ " + clockText(item.time);
      if (!window.confirm("این ایونت حذف شود؟\n" + label)) return;
      saveMsg.textContent = "در حال حذف…";
      const response = await fetch("/api/clips/" + encodeURIComponent(clipStem) + "/events/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: item.id }),
      });
      const data = await response.json();
      if (!response.ok) {
        saveMsg.textContent = data.message || "حذف نشد.";
        return;
      }
      events = data.events || [];
      dirty.clear();
      current = Math.min(current, Math.max(0, events.length - 1));
      saveMsg.textContent = events.length ? "حذف شد." : "همه ایونت‌ها حذف شدند.";
      if (!events.length) {
        renderList();
        return;
      }
      draw();
      go(current);
    }

    function setCoordsFromMap(event) {
      if (!events[current]) return;
      const rect = mapEl.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const x = clamp(((event.clientX - rect.left) / rect.width) * 105, 0, 105);
      const y = clamp((1 - (event.clientY - rect.top) / rect.height) * 68, 0, 68);
      events[current].x = Math.round(x * 10) / 10;
      events[current].y = Math.round(y * 10) / 10;
      fieldX.value = events[current].x;
      fieldY.value = events[current].y;
      dirty.add(events[current].id);
      draw();
    }

    function destination(index) {
      const next = events[index + 1];
      if (!next || next.x === null || next.y === null) return null;
      return { x: next.x, y: next.y, until: next.time };
    }

    function ballAt(time) {
      const index = indexAt(time);
      const item = events[index];
      if (!item || item.x === null || item.y === null) return null;
      const end = isPass(item) ? destination(index) : null;
      if (!end || end.until <= item.time) return { x: item.x, y: item.y };
      const progress = clamp((time - item.time) / (end.until - item.time), 0, 1);
      return {
        x: item.x + (end.x - item.x) * progress,
        y: item.y + (end.y - item.y) * progress,
      };
    }

    function placeBall(point) {
      if (!point) {
        ball.hidden = true;
        return;
      }
      const x = clamp(point.x, 0, 105);
      const y = clamp(point.y, 0, 68);
      ball.hidden = false;
      ball.style.left = (x / 105) * 100 + "%";
      ball.style.bottom = (y / 68) * 100 + "%";
    }

    function indexAt(time) {
      let found = 0;
      for (let i = 0; i < events.length; i += 1) {
        if (events[i].time <= time + 0.04) found = i;
      }
      return found;
    }

    function shownTime(time) {
      if (Number.isFinite(time)) return time;
      if (Number.isFinite(video.currentTime)) return video.currentTime;
      return events[current] ? events[current].time : 0;
    }

    function drawPasses(time) {
      passes.replaceChildren();
      time = shownTime(time);
      events.forEach((item, index) => {
        if (!isPass(item) || item.time > time + 0.04) return;
        if (item.x === null || item.y === null) return;
        const end = destination(index);
        if (!end) return;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        const team = teamClass(item);
        line.setAttribute("class", "pass" + (team ? " " + team : ""));
        line.setAttribute("x1", clamp(item.x, 0, 105));
        line.setAttribute("y1", 68 - clamp(item.y, 0, 68));
        line.setAttribute("x2", clamp(end.x, 0, 105));
        line.setAttribute("y2", 68 - clamp(end.y, 0, 68));
        passes.appendChild(line);
      });
    }

    function draw(time) {
      time = shownTime(time);
      const event = events[current];
      marks.replaceChildren();
      events.forEach((item, index) => {
        if (item.x === null || item.y === null) return;
        const off = item.x < 0 || item.x > 105 || item.y < 0 || item.y > 68;
        const x = clamp(item.x, 0, 105);
        const y = clamp(item.y, 0, 68);
        const button = document.createElement("button");
        button.type = "button";
        const team = teamClass(item);
        button.className = "mark"
          + (index === current ? " now" : "")
          + (off ? " off" : "")
          + (team ? " " + team : "");
        button.style.left = (x / 105) * 100 + "%";
        button.style.bottom = (y / 68) * 100 + "%";
        button.setAttribute("aria-label", labelOf(item.type) + " " + clockText(item.time));
        button.addEventListener("click", () => go(index));
        marks.appendChild(button);
      });
      drawPasses(time);
      const point = ballAt(time);
      placeBall(point);
      if (!event) return;
      document.querySelector("#count").textContent = "ایونت " + fa(current + 1) + " از " + fa(events.length);
      clock.textContent = clockText(time);
      kind.textContent = labelOf(event.type);
      const level = confidenceLevel(event.confidence);
      confidenceEl.hidden = false;
      confidenceEl.className = "conf " + level;
      confidenceEl.textContent = "اطمینان " + confidenceText(event.confidence);
      place.textContent = point ? "توپ " + point.x.toFixed(1) + " , " + point.y.toFixed(1) : "مختصات توپ خالی است";
      prev.disabled = current <= 0;
      next.disabled = current >= events.length - 1;
      renderList();
      fillForm();
    }

    function follow(time) {
      const point = ballAt(time);
      placeBall(point);
      if (point && isPass(events[current])) {
        place.textContent = "توپ " + point.x.toFixed(1) + " , " + point.y.toFixed(1);
      }
      drawPasses();
    }

    function go(index) {
      readFormIntoCurrent();
      current = Math.max(0, Math.min(events.length - 1, index));
      const target = events[current].time || 0;
      if (Math.abs((video.currentTime || 0) - target) < 0.05) {
        seeking = false;
        draw();
        return;
      }
      seeking = true;
      video.currentTime = target;
      draw(target);
    }

    prev.addEventListener("click", () => go(current - 1));
    next.addEventListener("click", () => go(current + 1));
    document.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      if (stage.hidden) return;
      event.preventDefault();
      go(current + (event.key === "ArrowRight" ? 1 : -1));
    }, true);
    let motion = 0;

    function track() {
      if (video.paused || video.ended) return;
      const time = video.currentTime || 0;
      if (!seeking) {
        const nextIndex = indexAt(time);
        if (nextIndex !== current) {
          current = nextIndex;
          draw();
        } else {
          clock.textContent = clockText(time);
          follow(time);
        }
      }
      motion = requestAnimationFrame(track);
    }

    video.addEventListener("play", () => {
      cancelAnimationFrame(motion);
      motion = requestAnimationFrame(track);
    });
    video.addEventListener("pause", () => cancelAnimationFrame(motion));
    video.addEventListener("timeupdate", () => {
      if (seeking || !video.paused) return;
      const time = video.currentTime || 0;
      const nextIndex = indexAt(time);
      if (nextIndex !== current) {
        current = nextIndex;
        draw();
        return;
      }
      clock.textContent = clockText(time);
      follow(time);
    });
    video.addEventListener("seeked", () => {
      seeking = false;
      current = indexAt(video.currentTime || 0);
      draw();
    });

    async function showChoices() {
      const response = await fetch("/api/clips", { cache: "no-store" });
      const data = await response.json();
      choices.hidden = false;
      data.clips.forEach((clip) => {
        const item = document.createElement("li");
        const link = document.createElement("a");
        link.href = "/watch?stem=" + encodeURIComponent(clip.stem);
        link.textContent = clip.video_name || clip.stem;
        item.appendChild(link);
        choices.appendChild(item);
      });
      if (!data.clips.length) {
        empty.hidden = false;
        empty.textContent = "هنوز ایونتی ساخته نشده. اول یک ویدیو را اجرا کن.";
      }
    }

    async function showClip(stem) {
      const hinted = params().get("video");
      if (hinted) {
        await fetch("/api/clips/" + encodeURIComponent(stem) + "/source", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path: hinted }),
        });
      }
      const response = await fetch("/api/clips/" + encodeURIComponent(stem), { cache: "no-store" });
      const data = await response.json();
      if (!response.ok) {
        empty.hidden = false;
        empty.textContent = data.message || "این اجرا پیدا نشد.";
        return;
      }
      events = data.events || [];
      clipStem = stem;
      dirty.clear();
      title.textContent = data.video_name || stem;
      if (!data.media) {
        empty.hidden = false;
        empty.textContent = "ایونت‌ها ذخیره شده‌اند. از صفحه قبل همان فایل ویدیو را انتخاب کن و دوباره نمایش را بزن. لازم نیست مدل را از نو اجرا کنی.";
        return;
      }
      stage.hidden = false;
      work.hidden = false;
      video.src = data.media;
      current = 0;
      draw();
    }

    sortBy.addEventListener("change", renderList);
    filterLow.addEventListener("change", renderList);
    [fieldType, fieldTime, fieldX, fieldY, fieldResult, fieldBodypart, fieldJersey, fieldTeam, fieldStatus, fieldNote].forEach((field) => {
      field.addEventListener("change", () => { readFormIntoCurrent(); renderList(); draw(); });
      field.addEventListener("input", () => { readFormIntoCurrent(); });
    });
    reviewForm.addEventListener("submit", (event) => {
      event.preventDefault();
      saveEdits(true).catch(() => { saveMsg.textContent = "ذخیره نشد."; });
    });
    document.querySelector("#saveAll").addEventListener("click", () => {
      saveEdits(false).catch(() => { saveMsg.textContent = "ذخیره نشد."; });
    });
    document.querySelector("#addEvent").addEventListener("click", () => {
      addEventAtVideo().catch(() => { saveMsg.textContent = "افزوده نشد."; });
    });
    document.querySelector("#deleteEvent").addEventListener("click", () => {
      deleteCurrentEvent().catch(() => { saveMsg.textContent = "حذف نشد."; });
    });
    document.querySelector("#deleteEventForm").addEventListener("click", () => {
      deleteCurrentEvent().catch(() => { saveMsg.textContent = "حذف نشد."; });
    });
    mapEl.addEventListener("click", (event) => {
      if (event.target.closest(".mark")) return;
      setCoordsFromMap(event);
    });

    const stem = params().get("stem");
    if (stem) showClip(stem).catch(() => { empty.hidden = false; empty.textContent = "ارتباط با برنامه قطع شد."; });
    else showChoices().catch(() => { empty.hidden = false; empty.textContent = "ارتباط با برنامه قطع شد."; });
  </script>
</body>
</html>
